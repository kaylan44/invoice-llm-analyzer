[project]
name = "invoice-llm-analyzer"
version = "0.1.0"
description = "Supplier invoice extraction with Gemini, consistency checks and human review"
requires-python = ">=3.12"
dependencies = [
    "invoice-api",
    "invoice-evals",
]

[tool.uv]
# The root only ties the workspace together; it is not an installable package.
package = false

[tool.uv.workspace]
members = [
    "api",
    "evals",
]

[tool.uv.sources]
invoice-api = { workspace = true }
invoice-evals = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["api/tests", "evals/tests"]
# importlib mode lets two packages both have tests/test_smoke.py without name clashes.
addopts = "--import-mode=importlib -m 'not live'"
markers = ["live: calls the real Gemini API (uses quota); run with -m live"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["invoice_api", "invoice_evals"]

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
