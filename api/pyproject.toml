[project]
name = "invoice-api"
version = "0.1.0"
description = "Invoice domain: schema, Gemini extraction, consistency checks, FastAPI app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.6.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
