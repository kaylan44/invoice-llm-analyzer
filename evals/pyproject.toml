[project]
name = "invoice-evals"
version = "0.1.0"
description = "Synthetic invoice generator, metrics and evaluation harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.63.0",
    "invoice-api",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "pypdfium2>=5.15.2",
    "weasyprint>=70.0",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
invoice-api = { workspace = true }
